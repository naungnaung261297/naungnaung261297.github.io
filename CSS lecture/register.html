<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Register Form</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <h1>Register Form</h1>
    <form action="#" method="get" id="myForm">
        <div>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" readonly value="Naung Naung">
        </div>
        <br>

        <div>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email">
        </div>
        <br>

        <div>
            <label for="phone">Phone</label><br>
            <input type="number" name="phone" id="phone">
        </div><br>

        <div>
            <label for="Gender">Gender</label><br>

            <input type="radio" name="Gender" id="male" value="male">
            <label for="male">Male</label>

            <input type="radio" name="Gender" id="female" value="female">
            <label for="female">Female</label>

            <input type="radio" name="Gender" id="other" value="other">
            <label for="other">Other</label>
        </div>
        <br>

        <div id="hobby">
            <label for="hobby">Hobbies</label><br>

            <input type="checkbox" name="hobby" id="reading" value="reading">
            <label for="reading">Reading</label><br>

            <input type="checkbox" name="hobby" id="football" value="football" disabled>
            <label for="football">Football</label><br>

            <input type="checkbox" name="hobby" id="basketball" value="basketball" disabled>
            <label for="basketball">Basketball</label><br>

            <input type="checkbox" name="hobby" id="tennis" value="tennis">
            <label for="tennis">Tennis</label>

        </div><br><br>

        <fieldset>
            <legend>Rules</legend>

            <ul>
                <li>This is the first rule</li>
                <li>This is the second rule</li>
                <li>This is the third rule</li>
                <li>This is the fourth rule</li>
                <li>This is the fifth rule </li>
                <li>This is the sixth rule</li>
                <li>This is the seventh rule</li>
            </ul>
        </fieldset>

        <p></p>
        <p>Thank you for registering. </p>
        <p></p>
        
            <button type="submit" class="register_btn">Submit</button>
    </form>

    <br><br><br>

</body>
</html>
