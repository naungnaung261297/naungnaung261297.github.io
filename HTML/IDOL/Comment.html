<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment</title>
</head>
<body>
    <h2 align="center">Leave a Comment</h2>
    <table border="0" cellspacing="0" cellpadding="15" align="center">
        <tr>
            <td> <label for="name">Name:</label> </td> 
            <td> <input type="text" name="Name:" id="name"></td>
        </tr>
        <br><br>
        <tr>
            <td><label for="email">Email:</label> </td> 
            <td> <input type="email" name="Email:" id="email"></td>
        </tr>
        <br><br>
        <tr>
            <td><label for="text">Comment</label></td> 
            <td> <textarea name="Comment" id="text" cols="25" rows="10"></textarea></td>
        </tr>
    </table>
    <p align="center"><button type="submit">Add</button></p>
    <hr>
</body>
