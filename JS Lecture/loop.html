    <script>    

    // <!-- loop (၃)မျိုး (for loop, while loop, do while loop) -->

    // <!-- for loop ဒီစကားလုံးလေးကို ထပ်ခါထပ်ခါ အကြိမ်ပေါင်းများစွာ ထုတ်စေချင်ရင် သုံး။ အကြိမ်အရေအတွက် တိတိကျကျသိတဲ့အခါ သုံး။

        // for loop

        document.write("<h1>Hello World</h1>");

        for(let i = 0; i < 10; i++){
            document.write("<h3>Hello World "+ (i+1) +" </h3>");
            document.write(`<h3>Hello World ${i+1} </h3>`);
        }

        let laptopList = ['Macbook Pro', 'Macbook Air', 'Macbook', 'Mac Mini', 'iMac'];

        document.write("<h3>My laptop is "+ laptopList[0] +" </h3>");

        document.write(`<h3>My laptop is ${laptopList[0]} </h3>`);

        for(let i = 0; i < laptopList.length; i++){

        }

        for(let i = 0; i < 3; i++){
            // document.write(`*`);
            for(let k = 0; k <= i; k++){
                document.write(`*`);
            }
            document.write(`<br>`);
        }
    

        // homework
        // *****
        // ****
        // ***
        // **
        // *

        for(let i = 4; i >=0; i--){
            // document.write(`*`);
            for(let k = 0; k <= i; k++){
                document.write(`*`);
            }
            document.write(`<br>`);
        }

        for(let i = 0; i < 3; i++){
            for(let k = 0; k < 3 - i; k++){
            document.write(`*`);
            }
            document.write(`<br>`);
        }

        // while(condition)

        // do{

        do{
            document.write(`Your Number is Do While Loop ${number} <br>`);
