<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date</title>
</head>
<body>

    <h1>Date</h1>

    <p id="time"> </p>

    <script>
        // date
        let date = new Date();
        console.log(date);



        let getYear = date.getFullYear();
        console.log(getYear);

        let getMonth = date.getMonth();
        console.log(getMonth); // 0-11 (January, February, March, April, May, June, July, August, September, October, November, December)

        let getDate = date.getDay();
        console.log(getDate);

        // 1-Sunday, 2-Monday, 3-Tuesday, 4-Wednesday, 5-Thursday, 6-Friday, 7-Saturday

        let getHour = date.getHours();
        console.log(getHour);

        let getMinute = date.getMinutes();
        console.log(getMinute);

        let getSecond = date.getSeconds();
        console.log(getSecond);

        let getTimeFormat = date.toLocaleTimeString();
        console.log(getTimeFormat);

        function getDateFormat(date){
            let myDate = new Date();
            let getSecond = myDate.toLocaleTimeString();
            let time = document.getElementById("time");
            time.innerHTML = getSecond;
        }

        // getDateFormat();

        setInterval(getDateFormat,1000);
        


    

    </script>
    
</body>
</html>
