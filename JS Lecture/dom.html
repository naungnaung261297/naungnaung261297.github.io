<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    
    <h1 id="myId">Dom <i> Lecture</i> Lessons</h1>

    <p class="myClass"> My class one.</p>
    <p class="myClass"> My class two.</p>
    <p class="myClass"> My class three.</p>

    <div class=""> My class four.</div>

    <script>

        // selector (၅)မျိုးရှိ 

        // id selector
        let myId = document.getElementById("myId");

        console.log(myId.innerHTML);

        document.write(myId.innerHTML);
        document.write("<br>");
        document.write(myId.innerText);

        // class selector 
        let myClass = document.getElementsByClassName("myClass");
        console.log(myClass[1].innerText);

        // query selector
        let myQueryId = document.querySelector("#myId");
        console.log(myQueryId.innerText);

        let myQueryClass = document.querySelector(".myClass");
        console.log(myQueryClass.innerText);

        // tag selector (tag selector သည် class selector နဲ့ အလားသဏ္ဍာန် တူပါသည်။)

        let myTag = document.getElementsByTagName("div");
        console.log(myTag[0].innerText);

        // querySelectorAll (tag selector , class selector အစား အသုံးပြုပါသည်။)

        let myQueryAll = document.querySelectorAll(".myClass");
        console.log(myQueryAll[3].innerText);


    </script>

</body>
</html>
