<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical</title>
</head>
<body>
    
    <h1>Logical Lessons</h1>

    <script>
        // OR operator || (တစ်ခုထက်မက comparsion လုပ်နိုင်) ( OR operator က အနည်းဆုံး တစ်ခုမှန်လျှင် true ဖြစ်)
        let num1 = 10;
        let num2 = 20;

        console.log(num1 < num2 || num1 == num2) // true || false. => true

        // AND operator && (And Operator က အနည်းဆုံး တစ်ခုမှားတာနဲ့ false ဖြစ်)

        console.log(num1 < num2 && num1 == num2) // true && false. => false

        // Not operator ! ဒေတာ ရှိလား မရှိလား အငြင်းလုပ်ရင် သုံး
        let num3 = 10;

        console.log(!num3); // false



    </script>

</body>
</html>
