<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event</title>
</head>
<body>

    <h1>Event</h1>

    <!-- <img src="images/1.jpg" alt="" width="200" height="200" onmouseenter="big()" id="myImg" onmouseleave="normal()"> -->

    <img src="images/1.jpg" alt="" width="200" height="200" onmouseover="big()" id="myImg" onmouseout="normal()"> <br><br>


    <!-- <input type="text" onkeyup="result()" id="myInput"> -->
    <input type="text" onkeydown="result()" id="myInput">
    <!-- <input type="text" onchange="result()" id="myInput"> -->

    <p id="myP"></p>

    <script>
        // onmouseover
        // onmouseenter
        function big(){
            let myImg = document.getElementById('myImg');
            myImg.style.width = '400px';
            myImg.style.height = '400px';
            myImg.style.borderRadius = '50%'
        }

        // onmouseleave
        // onmouseout
        function normal(){
            let myImg = document.getElementById('myImg');
            myImg.style.width = '200px';
            myImg.style.height = '200px';
            myImg.style.borderRadius = '0px'
        }

        // onkeyup (ကိုယ် ရိုက်တဲ့ စာလုံး ချက်ချင်းပေါ်သည်။)
        // onkeydown (နောက်စာလုံး ရိုက်မှသာ ရှေ့စာလုံး ပေါ်သည်။)
        // onchange (Inupt အတွင်း ရိုက်နေသရွှေ့ စာလုံး မပေါ်။ coursor အပြင်ရောက်မှသာ စာလုံးပေါ်သည်။)
        function result(){
            let myInput = document.getElementById('myInput');
            let result = myInput.value;

            let myP = document.getElementById('myP');
            myP.innerHTML = `<i>${result}</i>`;
            // myP.innerText = result;
        }

    </script>
    
</body>
</html>
