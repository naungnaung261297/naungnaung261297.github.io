<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator</title>
</head>
<body>
    
    <h1>Operator </h1>

    <script>
        // assign operator (=) ညီမျှခြင်း
        let name = "Naung Naung";

        // addition operator (+) ပေါင်းခြင်း
        let number = 4 + 5 ;
        console.log(number);
        let fourFive = '4' + 5 ;
        console.log(fourFive);

        let number1 = 20000;
        let number2 = 10000;
        
        let number3 = number1 + number2;
        console.log(number3);

        let num = 10;
        // num = num + 1;
        num += 5;        
        console.log(num);

        let numOne = 10;
        // numOne++;
        console.log(numOne++)
        console.log(++numOne);
        console.log(numOne);

        // subtraction operator (-) နှုတ်ခြင်း
         let numTwo = 10;
        numTwo -= 5;
        console.log(numTwo);

        let numThree = 10;
        console.log(numThree);
        console.log(--numThree);
        console.log(numThree--);

        // multiplication operator (*) မြှောက်ခြင်း
        let numFour = 250;
        numFour *= 5;
        // numFour = numFour * 5;
        console.log(numFour);

        // division operator (/) စားခြင်း (စားလဒ်)
        let numFive = 50;
        numFive = numFive / 2;
        console.log(numFive);

        // remainder operator (%) စားကြွင်း

        let numSix = 27;
        numSix = numSix % 2;
        console.log(numSix);

        // exponent operator (**) နှစ်ထပ်ကိန်း

        let numSeven = 12;
        numSeven = numSeven ** 5;
        console.log(numSeven);

        const num7 = 2;
        const num8 = 6;
        const num9 = num7 ** num8;

        console.log(num9);

        // presendence operator () ကွင်း၏ မြှောက်/ စား/ ပေါင်း/ နှုတ် 

        let result = (4 +5) - 2 * 5 / 2 % 3;
        console.log(result);

    </script>


</body>
</html>
