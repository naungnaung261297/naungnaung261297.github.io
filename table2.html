<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Invoice</h1>
    <table border="1" cellspacing="0" cellpadding="30">
        <thead>
            <tr>
                <th>No.</th>
                <th>Item Name</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Signal</td>
                <td align="right">9000</td>
                <td align="center">1</td>
                <td align="right">9000</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Bubble</td>
                <td align="right">12500</td>
                <td align="center">1</td>
                <td align="right">12500</td>
            </tr>
            <tr>
                <td>3</td>
                <td>OMG Noddle</td>
                <td align="right">1400</td>
                <td align="center">5</td>
                <td align="right">7000</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Egg</td>
                <td>500</td>
                <td align="center">10</td>
                <td align="right">5000</td>
            </tr>
        </tbody>
        <tfoot>
            <th colspan="3">Total</th>
            <th align="center" style="color: blue ">17</th>
            <th align="right">33500</th>
        </tfoot>
    </table>

    <h1>Saving Money</h1>
    <table border="1" cellspacing="0" cellpadding="30">
        <thead>
            <tr>
                <th> <i>Months </i></th>
                <th> <em>Save Money</em></th>
                <th> <i>Total</i></th>
             </tr>
        </thead>
        <tbody>
            <tr>
                <td>January</td>
                <td align="right">100000</td>
                <td rowspan="4"> 400000</td>
            </tr>
            <tr>
                <td>February</td>
                <td align="right">50000</td>
            </tr>
            <tr>
                <td>March</td>
                <td align="right">100000</td>
            </tr>
            <tr>
                <td>April</td>
                <td align="right">150000</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
